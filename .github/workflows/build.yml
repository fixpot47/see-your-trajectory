name: Build See your Trajectory!

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Clone upstream source
        run: |
          git clone https://github.com/maDU59/ProjectilesTrajectoryPreview.git upstream
          cd upstream
          git checkout d4fc4d7084f192113f96fad95ba16d09c098c700

      - name: Apply See your Trajectory 26.3 patch
        run: python3 tools/apply_rebrand.py upstream

      - name: Build
        run: |
          cd upstream
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Collect jar
        run: |
          mkdir -p dist
          JAR=$(find upstream/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$JAR"
          cp "$JAR" dist/see-your-trajectory-1.1.0+mc26.3.jar

      - name: Upload ready jar
        uses: actions/upload-artifact@v4
        with:
          name: see-your-trajectory-1.1.0-mc26.3
          path: dist/see-your-trajectory-1.1.0+mc26.3.jar
